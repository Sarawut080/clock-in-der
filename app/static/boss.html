<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แดชบอร์ด — บันทึกเวลาเข้า-ออกงาน</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* หัววันที่ติดขอบบนตอนเลื่อน: เผื่อที่ให้ element ที่ได้โฟกัสไม่ถูกบัง */
    html { scroll-padding-block-start: 3rem; }
    body { background: var(--color-bg-surface); }

    .page { display: grid; gap: var(--space-5); max-width: 68rem; margin: 0 auto; padding: var(--space-5) var(--space-5) var(--space-6); }

    .bar { display: flex; justify-content: space-between; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
    .bar nav { display: flex; flex-wrap: wrap; gap: var(--space-2); }
    .bar .btn { min-height: 44px; padding-inline: var(--space-4); }

    /* ตัวกรอง: select 2 ช่องในแถวเดียว เลือก "กำหนดเอง" แล้วช่องวันที่จึงปรากฏ */
    .filters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 16rem));
      gap: var(--space-4);
      align-items: end;
      padding-block: var(--space-5);
      border-block: 1px solid var(--color-separator);
    }
    .range { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 16rem)); gap: var(--space-4); align-items: start; }
    /* ปุ่มอยู่ระดับเดียวกับช่องกรอก (ข้ามความสูงของป้ายชื่อช่อง) แม้ช่องมีข้อความผิดพลาดต่อท้าย */
    .range .btn { margin-top: calc(var(--text-body) * 1.6 + var(--space-2)); }

    .result-head { display: grid; gap: var(--space-4); }
    .eyebrow { display: block; font-size: var(--text-caption); font-weight: 400; line-height: 1.4; color: var(--color-text-secondary); }

    /* แถบสรุป 3 ช่องเท่ากัน: ตัวเลขเป็นตัวหลัก ชื่อสถานะอยู่ใต้ตัวเลข
       แถบสีด้านซ้ายเป็นแค่ตัวช่วยตา ความหมายอยู่ที่ไอคอน + ชื่อ (ไม่สื่อด้วยสีอย่างเดียว) */
    .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); margin: 0; }
    .kpi {
      display: flex; flex-direction: column-reverse; justify-content: flex-end; gap: var(--space-1);
      padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4);
      background: var(--color-bg-sunken);
      border-inline-start: 4px solid var(--kpi-color);
      border-radius: var(--radius-control);
    }
    .kpi-ok { --kpi-color: var(--color-success-solid); }
    .kpi-short { --kpi-color: #f28a1e; }
    .kpi-incomplete { --kpi-color: #f5c828; }
    .kpi dt { display: flex; align-items: flex-start; gap: var(--space-1); font-size: var(--text-caption); line-height: 1.4; color: var(--color-text-secondary); text-wrap: balance; }
    .kpi dt svg { width: 16px; height: 16px; flex: none; }
    .kpi dd { margin: 0; font-size: var(--text-title); font-weight: 600; line-height: 1.2; }
    .kpi dd small { font-size: var(--text-caption); font-weight: 400; color: var(--color-text-secondary); }
    .kpi.is-zero dd { color: var(--color-text-secondary); font-weight: 400; }

    /* ---- ตาราง (จอกว้าง) ---- */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: var(--space-3) var(--space-4); text-align: start; vertical-align: middle; }
    thead th { font-size: var(--text-caption); font-weight: 400; color: var(--color-text-secondary); border-bottom: 1px solid var(--color-border-strong); }
    tbody td { border-bottom: 1px solid var(--color-separator); }
    .col-num { text-align: end; }
    .group th { position: sticky; top: 0; z-index: 1; padding-block: var(--space-2); font-size: var(--text-caption); font-weight: 600; background: var(--color-bg-sunken); border-bottom: 1px solid var(--color-separator); }
    .detail > td { background: var(--color-bg-sunken); }

    /* ปุ่มดูรูป: เป็นปุ่มกรอบบางเหมือนปุ่มอื่น ไม่ใช่ลิงก์สีฟ้า บอกชัดว่ากดแล้วได้อะไร */
    .photos-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
      min-height: 44px; padding: var(--space-1) var(--space-4);
      font: inherit; font-weight: 600; white-space: nowrap;
      color: var(--color-accent-text); background: var(--color-bg-surface);
      border: 1px solid var(--color-border-default); border-radius: var(--radius-control); cursor: pointer;
    }
    .photos-btn::after {
      content: ""; flex: none; width: 7px; height: 7px;
      border-inline-end: 2px solid currentColor; border-block-end: 2px solid currentColor;
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .photos-btn[aria-expanded="true"]::after { transform: rotate(-135deg) translate(-1px, -1px); }
    @media (hover: hover) { .photos-btn:hover { background: var(--color-bg-hover); } }
    @media (prefers-reduced-motion: no-preference) { .photos-btn::after { transition: transform 150ms ease-out; } }

    .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: var(--space-4); }
    .shot { display: grid; gap: var(--space-2); }
    .shot .photo, .shot .missing { aspect-ratio: 3 / 4; }
    .shot .missing { display: grid; place-items: center; padding: var(--space-3); text-align: center; font-size: var(--text-caption); color: var(--color-text-secondary); border: 1px dashed var(--color-border-default); border-radius: var(--radius-control); }

    .empty { display: grid; gap: var(--space-1); padding: var(--space-6) var(--space-4); text-align: center; border-bottom: 1px solid var(--color-separator); }

    /* ---- จอแคบ (โทรศัพท์): แถวละ 2 บรรทัด ไม่เลื่อนข้าง ไม่ซ้ำหัวคอลัมน์ทุกแถว ---- */
    @media (max-width: 40rem) {
      .page { gap: var(--space-4); padding: var(--space-4) var(--space-4) var(--space-6); }
      h1 { font-size: var(--text-heading); }

      .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); padding-block: var(--space-4); }
      .range { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
      .range .btn { grid-column: 1 / -1; margin-top: 0; }

      table, tbody { display: block; }
      thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

      .kpis { gap: var(--space-2); }
      .kpi { padding: var(--space-3) var(--space-2) var(--space-3) var(--space-3); }

      /* แถวคนละ 3 บรรทัด: ชื่อ+ป้ายสถานะ / เข้างาน·ออกงาน·รวม (คอลัมน์ตรงกันทุกแถว) / ปุ่มดูรูป */
      tr.person {
        display: grid;
        /* 7 ส่วน: บรรทัดบน ชื่อ 3 + ป้ายสถานะ 4 (ป้ายกว้าง 10rem ต้องพอดี) · บรรทัดล่าง เข้า 2 + ออก 2 + รวม 3 */
        grid-template-columns: repeat(7, minmax(0, 1fr));
        grid-template-areas:
          "name name name status status status status"
          "in in out out hours hours hours"
          "photos photos photos photos photos photos photos";
        gap: var(--space-3) var(--space-3);
        align-items: start;
        padding: var(--space-4) 0;
        border-bottom: 1px solid var(--color-separator);
      }
      tr.person > td { display: block; padding: 0; border: 0; }
      td.c-name { grid-area: name; align-self: center; font-size: var(--text-heading); line-height: 1.3; }
      /* ความกว้างกำหนดที่ช่อง (ไม่ใช่ที่ป้าย) เพราะช่องที่ justify-self: end จะหดตามเนื้อหา แล้วป้ายแต่ละแถวกว้างไม่เท่ากัน */
      td.c-status { grid-area: status; justify-self: end; align-self: center; width: min(10rem, 100%); }
      td.c-in { grid-area: in; }
      td.c-out { grid-area: out; }
      td.c-hours { grid-area: hours; }
      td.c-photos { grid-area: photos; }
      td.c-photos .photos-btn { min-height: 40px; padding-inline: var(--space-3); }
      td[data-label]::before { content: attr(data-label); display: block; font-size: var(--text-caption); line-height: 1.4; color: var(--color-text-secondary); }
      .col-num { text-align: start; }
      .badge { width: 100%; }

      tr.group, tr.detail { display: block; }
      /* แถวหัววันที่เป็นตัวติดขอบ (ไม่ใช่ th) เพราะ th ถูกกักอยู่ในแถวของตัวเอง ติดไม่ได้ */
      tr.group { position: sticky; top: 0; z-index: 1; }
      tr.group > th, tr.detail > td { display: block; }
      tr.group > th { padding-inline: var(--space-3); }
      tr.detail > td { padding: var(--space-3); }
      .photos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-3); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="bar">
      <h1>แดชบอร์ด</h1>
      <nav aria-label="สลับหน้า">
        <a class="btn" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ไปหน้าบันทึกเวลา
        </a>
        <button class="btn" id="logout-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          ออกจากระบบ
        </button>
      </nav>
    </header>

    <!-- UC6 -->
    <section class="filters" aria-label="กรองข้อมูล">
      <label class="field">ช่วงเวลา
        <select id="period">
          <option value="today">วันนี้</option>
          <option value="yesterday">เมื่อวาน</option>
          <option value="7">7 วันล่าสุด</option>
          <option value="30">30 วันล่าสุด</option>
          <option value="custom">กำหนดเอง</option>
        </select>
      </label>
      <label class="field">พนักงาน
        <select id="employee">
          <option value="">ทุกคน</option>
        </select>
      </label>
      <form class="range" id="filters" aria-label="ช่วงวันที่ที่กำหนดเอง" novalidate hidden>
        <div class="field-group">
          <label for="from">ตั้งแต่วันที่</label>
          <input type="date" id="from" aria-describedby="from-error">
          <p class="field-error" id="from-error"></p>
        </div>
        <div class="field-group">
          <label for="to">ถึงวันที่</label>
          <input type="date" id="to" aria-describedby="to-error">
          <p class="field-error" id="to-error"></p>
        </div>
        <button class="btn btn-primary" type="submit">แสดงข้อมูล</button>
      </form>
    </section>

    <div class="notice" id="notice" role="alert"></div>

    <!-- UC5 -->
    <section class="result-head" aria-live="polite">
      <h2 id="result-title"></h2>
      <dl class="kpis" id="counts"></dl>
    </section>
    <div id="table-wrap"></div>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/boss.js"></script>
</body>
</html>
