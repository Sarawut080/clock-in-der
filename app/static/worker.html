<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>บันทึกเวลาเข้า-ออกงาน</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    /* ส่วนชั่วโมงสะสม: แบ่งด้วยเส้นบางและช่องไฟ ไม่ใช้กรอบ */
    .day { display: grid; gap: var(--space-4); padding-top: var(--space-5); border-top: 1px solid var(--color-separator); }

    /* ตัวเลขชั่วโมงคือสิ่งเดียวบนหน้าที่ตั้งใจให้เด่น */
    .figure {
      font-size: var(--text-figure);
      font-weight: 600;
      line-height: 1.05;
      letter-spacing: -0.02em;        /* ใช้กับตัวเลขละตินเท่านั้น ไม่ใช้กับข้อความไทย */
    }
    .figure small { margin: 0 var(--space-3) 0 var(--space-1); font-size: var(--text-heading); font-weight: 400; letter-spacing: 0; color: var(--color-text-secondary); }

    #hours-note:empty { display: none; }  /* ไม่มีข้อความ = ไม่เว้นที่ว่างค้าง */
    #hours-note.is-warn { color: var(--color-danger-text); font-weight: 600; }

    /* เทปชั่วโมง: 8 ช่อง = 8 ชั่วโมง เติมทีละชั่วโมงเต็มช่อง
       ช่องทึบ = ชั่วโมงที่บันทึกครบแล้ว · ช่องลายเฉียง (is-live) = ได้มาจากรอบที่ยังนับอยู่ (ไม่มีข้อความอธิบายบนหน้าจอ ตามที่ผู้ใช้ขอ — ลายเฉียงต่างจากช่องทึบอยู่แล้ว) */
    .tape { display: grid; grid-template-columns: repeat(8, 1fr); gap: var(--space-1); }
    .tape-cell { position: relative; height: 12px; overflow: hidden; background: var(--color-bg-sunken); border: 1px solid var(--color-border-default); border-radius: 2px; }
    .tape-cell > i { position: absolute; inset: 0; background: var(--color-accent-solid); opacity: 0; }
    .tape-cell.is-filled > i { opacity: 1; }
    .tape-cell.is-live > i { background: repeating-linear-gradient(135deg, var(--color-accent-solid) 0 3px, var(--color-accent-border) 3px 6px); }
    .tape.is-full .tape-cell.is-filled > i { background: var(--color-success-solid); }
    .tape.is-full .tape-cell.is-live > i { background: repeating-linear-gradient(135deg, var(--color-success-solid) 0 3px, var(--color-success-border) 3px 6px); }
    .tape-scale { display: flex; justify-content: space-between; margin-top: var(--space-1); }

    /* รายการเข้า-ออก: เวลาชิดขวาเป็นหลักเดียวกัน */
    .log { display: grid; gap: var(--space-2); padding: 0; list-style: none; }
    .log li { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4); }
    .log .t { font-weight: 600; }

    .clock-btn { width: 100%; min-height: 64px; font-size: var(--text-heading); }

    .photo-step { display: grid; gap: var(--space-4); }
    .preview { max-height: 22rem; }
    .camera-btn { width: 100%; }
    #photo:focus-visible + .camera-btn { outline: 3px solid var(--color-focus-ring); outline-offset: 2px; }
    .pair { display: grid; grid-template-columns: 1fr 1.4fr; gap: var(--space-3); }

    .done { display: grid; gap: var(--space-2); justify-items: center; padding: var(--space-5) 0; text-align: center; }
    .done .figure { color: var(--color-accent-text); }
    .done .btn { margin-top: var(--space-4); width: 100%; }
  </style>
</head>
<body>
  <main class="sheet">
    <header class="masthead">
      <h1>บันทึกเวลาเข้า-ออกงาน</h1>
      <p><strong id="employee-name"></strong></p>
      <p class="muted" id="today-label"></p>
    </header>

    <!-- region ต้องมีใน DOM ตั้งแต่แรก แล้วค่อยใส่ข้อความ -->
    <div class="notice" id="notice" role="alert"></div>

    <!-- UC4 -->
    <section class="day" id="status" aria-labelledby="status-h" hidden>
      <h2 id="status-h">ชั่วโมงทำงานสะสมวันนี้</h2>
      <div>
        <p class="figure num" id="hours"></p>
        <p class="muted" id="hours-note"></p>
      </div>
      <div>
        <div class="tape" id="tape" role="img"></div>
        <div class="tape-scale caption muted num" aria-hidden="true"><span>0 ชม.</span><span>8 ชม.</span></div>
      </div>
      <ul class="log num" id="log" aria-label="รายการเข้า-ออกงานวันนี้"></ul>
    </section>

    <!-- UC2 / UC3 -->
    <section id="action" aria-label="บันทึกเวลา" hidden>
      <button class="btn btn-primary clock-btn" id="clock-btn" type="button"></button>

      <div class="photo-step" id="photo-step" hidden>
        <p id="photo-hint"></p>
        <img class="photo preview" id="preview" alt="รูปที่เพิ่งถ่าย" hidden>
        <input class="visually-hidden" id="photo" type="file" accept="image/*" capture="user">
        <label class="btn camera-btn" id="camera-label" for="photo">ถ่ายรูป</label>
        <div class="pair">
          <button class="btn" id="cancel-btn" type="button">ยกเลิก</button>
          <button class="btn btn-primary" id="confirm-btn" type="button" disabled></button>
        </div>
      </div>

      <div class="done" id="done" hidden>
        <p id="done-label"></p>
        <p class="figure num" id="done-time"></p>
        <button class="btn" id="done-btn" type="button">เสร็จสิ้น</button>
      </div>
    </section>

    <footer class="foot">
      <nav aria-label="สลับหน้า">
        <a class="btn" href="/boss">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          ไปหน้าแดชบอร์ด
        </a>
        <button class="btn" id="logout-btn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
          ออกจากระบบ
        </button>
      </nav>
    </footer>

    <!-- ประกาศผลสำเร็จให้ screen reader: อยู่ใน DOM ตลอด -->
    <p class="visually-hidden" id="announce" role="status"></p>
  </main>

  <script src="/static/common.js"></script>
  <script src="/static/worker.js"></script>
</body>
</html>
